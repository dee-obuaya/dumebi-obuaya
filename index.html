<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chukwudumebi Obuaya</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="./dist/output.css">
</head>
<body>
    <header>
        <section id="hero" class="relative container min-h-screen flex items-center justify-center text-center">
            <div class="space-y-2">
                <h1 class="reveal font-serif uppercase text-2xl sm:text-3xl md:text-4xl lg:text-5xl whitespace-nowrap">Chukwudumebi Obuaya</h1>
                <p class="reveal font-sans text-sm md:text-base" data-delay="short">Designer & Developer</p>
            </div>

            <p
                class="absolute bottom-10 right-10 reveal font-serif text-xs sm:text-sm italic opacity-70"
                data-reveal="load"
                data-delay="medium"
            >
                who notices small things...
            </p>
        </section>
    </header>

    <main>
        <section id="about" class="container">
            <p>About Me</p>
            <p class="reveal">
                I design and build web experiences that feel considered...
            </p>
        </section>

        <section id="projects" class="container">
            <p>Recent Work</p>
            <article class="project-card reveal">…</article>
        </section>

        <section id="contact" class="container">
            <p class="reveal">I'm open to freelance work and select collaborations</p>
        </section>
    </main>

    <footer class="container">
        <p class="reveal">© 2026 Chukwudumebi Obuaya</p>
    </footer>

    <script src="./js/reveal.js" defer></script>
</body>
</html>
